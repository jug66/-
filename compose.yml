services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: message_board
      POSTGRES_USER: message_board
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U message_board -d message_board"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
